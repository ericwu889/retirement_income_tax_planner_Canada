<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement Income &amp; Tax Planner</title>
<style>

    --tax:#B5542B; --red:#DC2626; --gold:#B08A2E; --slate:#6B7A8F;

  .container { max-width: 1180px; margin: 0 auto; padding: 24px 20px; }
  .title-row { display:flex; align-items:center; gap:12px; margin-bottom:6px; }

  .section-toggle { background:none; border:none; cursor:pointer; padding:0; margin:0; width:16px; height:16px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:#2E3540; line-height:1; }
  .section-toggle:hover { color:var(--text); }
  .section-label h3 { font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--text); margin:0; }

  .caption { margin-top:12px; font-size:12px; line-height:1.6; color:var(--muted); }

  @media (max-width: 560px) {

  .field-label { font-size:12px; color:var(--muted); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .field-suffix { flex-shrink:0; padding-right:8px; font-size:13px; color:var(--muted); }

  .person-toggle-box { display:flex; align-items:center; gap:4px; border:1px solid var(--border); border-radius:6px; background:#FFF; height:36px; padding:4px; }
  .person-toggle-box button { flex:1; height:100%; border:none; border-radius:4px; background:transparent; color:var(--muted); font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; font-family:'Inter',sans-serif; }
  .person-toggle-box button.active { background:var(--ink); color:#FFF; }

  .split-legend { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .split-legend .items { display:flex; flex-wrap:wrap; gap:8px; }
  .split-legend .dot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .split-box { display:flex; height:36px; width:100%; overflow:hidden; border-radius:6px; border:1px solid var(--border); }
  .split-seg { display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color:#FFF; font-family:'IBM Plex Mono',monospace; }

<script>
// Diagnostic safety net, deliberately kept in its own separate <script> tag
// ahead of the main application script. If the main script fails to parse
// or throws during setup, this block has already registered a global error
// handler and will still run, showing a visible message instead of a silent
// blank page. Kept intentionally simple (no modern syntax) for maximum
// compatibility with older or unusual mobile browser engines.
(function () {
  var shown = false;
  function showError(detail) {
    if (shown) return;
    shown = true;
    var el = document.getElementById('introText');
    if (!el) return;
    el.innerHTML = '<p style="color:#B5542B;font-weight:600;">This app hit a loading error in your browser and could not display normally.</p>' +
      '<p>Try reloading the page, or opening this file in a different browser (Chrome or Firefox are good options). ' +
      'If the problem continues, please share this message when reporting the issue:</p>' +
      '<p style="font-family:monospace;font-size:13px;background:#F2F3F1;padding:8px;border-radius:6px;word-break:break-all;">' +
      (detail || 'Unknown error — no details captured.') + '</p>';
  }
  window.addEventListener('error', function (e) {
    var msg = (e && e.message) ? e.message : 'Script error';
    var loc = (e && e.filename) ? (' (line ' + e.lineno + ', ' + e.filename.split('/').pop() + ')') : '';
    showError(msg + loc);
  });
  // Fallback: if nothing has populated the intro text within a few seconds,
  // something failed silently (no catchable error event fired). Show a
  // generic message rather than leaving the page blank.
  setTimeout(function () {
    var el = document.getElementById('introText');
    if (el && el.innerHTML.trim() === '') showError('The app did not finish loading (no specific error was reported by the browser).');
  }, 4000);
})();
</script>

<script>
"use strict";

// =============================================================================
// 2026 Federal + Provincial tax reference data
// =============================================================================
const FEDERAL_BRACKETS = [
  { upTo: 58523, rate: 0.14 },
  { upTo: 117045, rate: 0.205 },
  { upTo: 181440, rate: 0.26 },
  { upTo: 258482, rate: 0.29 },
  { upTo: Infinity, rate: 0.33 },
];
const FEDERAL_BPA_MAX = 16452;
const FEDERAL_BPA_MIN = 14829;
const FEDERAL_BPA_PHASE_START = 181440;
const FEDERAL_BPA_PHASE_END = 258482;

const FEDERAL_AGE_AMOUNT_MAX = 9208;
const FEDERAL_AGE_AMOUNT_THRESHOLD = 46432;
const FEDERAL_PENSION_INCOME_MAX = 2000;

// 2026 provincial/territorial retirement tax-credit amounts. These are
// applied automatically using information the app already has; no extra
// user inputs are required. Age amounts phase out at 15% above the listed
// threshold. Pension amounts are capped by the federal qualifying pension
// amount. Quebec is handled at household level because its age/retirement
// amounts are reduced using family income.
const RETIREMENT_CREDITS = {
  AB: { rate: 0.08,   ageMax: 6345,  ageThreshold: 47234, pensionMax: 1753 },
  BC: { rate: 0.056,  ageMax: 5927,  ageThreshold: 44119, pensionMax: 1000 },
  MB: { rate: 0.108,  ageMax: 3728,  ageThreshold: 27749, pensionMax: 1000 },
  NB: { rate: 0.094,  ageMax: 6158,  ageThreshold: 45844, pensionMax: 1000 },
  NL: { rate: 0.087,  ageMax: 7142,  ageThreshold: 39138, pensionMax: 1000 },
  NS: { rate: 0.0879, ageMax: 5826,  ageThreshold: 30828, pensionMax: 1173 },
  NT: { rate: 0.059,  ageMax: 8902,  ageThreshold: 46432, pensionMax: 1000 },
  NU: { rate: 0.04,   ageMax: 12550, ageThreshold: 46432, pensionMax: 2000 },
  ON: { rate: 0.0505, ageMax: 6342,  ageThreshold: 47210, pensionMax: 1796 },
  PE: { rate: 0.095,  ageMax: 6510,  ageThreshold: 36600, pensionMax: 1000 },
  SK: { rate: 0.105,  ageMax: 5901,  ageThreshold: 43927, pensionMax: 1000 },
  YT: { rate: 0.064,  ageMax: 9208,  ageThreshold: 46432, pensionMax: 2000 },
};

const QC_AGE_AMOUNT = 3986;
const QC_RETIREMENT_INCOME_MAX = 3541;
const QC_RETIREMENT_REDUCTION_THRESHOLD = 42955;
const QC_RETIREMENT_REDUCTION_RATE = 0.1875;
const QC_CREDIT_RATE = 0.14;


const ON_BRACKETS = [
  { upTo: 53891, rate: 0.0505 },
  { upTo: 107785, rate: 0.0915 },
  { upTo: 150000, rate: 0.1116 },
  { upTo: 220000, rate: 0.1216 },
  { upTo: Infinity, rate: 0.1316 },
];
const ON_BPA = 12989;
const ON_SURTAX_T1 = 5818;
const ON_SURTAX_T2 = 7446;

const QC_BRACKETS = [
  { upTo: 54345, rate: 0.14 },
  { upTo: 108680, rate: 0.19 },
  { upTo: 132245, rate: 0.24 },
  { upTo: Infinity, rate: 0.2575 },
];
const QC_BPA = 18952;
const QC_ABATEMENT_RATE = 0.165; 

const AB_BRACKETS = [
  { upTo: 61200, rate: 0.08 },
  { upTo: 154259, rate: 0.10 },
  { upTo: 185111, rate: 0.12 },
  { upTo: 246813, rate: 0.13 },
  { upTo: 370220, rate: 0.14 },
  { upTo: Infinity, rate: 0.15 },
];
const AB_BPA = 22769;

const PE_BRACKETS = [
  { upTo: 33928, rate: 0.095 },
  { upTo: 65820, rate: 0.1347 },
  { upTo: 106890, rate: 0.166 },
  { upTo: 142520, rate: 0.1762 },
  { upTo: 200000, rate: 0.19 },
  { upTo: Infinity, rate: 0.20 },
];
const PE_BPA = 15000;

const BC_BRACKETS = [
  { upTo: 50363, rate: 0.056 },
  { upTo: 100728, rate: 0.077 },
  { upTo: 115648, rate: 0.105 },
  { upTo: 140430, rate: 0.1229 },
  { upTo: 190405, rate: 0.147 },
  { upTo: 265545, rate: 0.168 },
  { upTo: Infinity, rate: 0.205 },
];
const BC_BPA = 13216;
// BC tax reduction credit — a general (not senior-specific) low-income tax
// reduction, individually tested (not combined with spouse's income, unlike
// PEI's family-income-tested LITR).
const BC_REDUCTION_MAX = 690;
const BC_REDUCTION_THRESHOLD = 25570;
const BC_REDUCTION_RATE = 0.0356;

const SK_BRACKETS = [
  { upTo: 54532, rate: 0.105 },
  { upTo: 155805, rate: 0.125 },
  { upTo: Infinity, rate: 0.145 },
];
const SK_BPA = 20381;

const MB_BRACKETS = [
  { upTo: 47000, rate: 0.108 },
  { upTo: 100000, rate: 0.1275 },
  { upTo: Infinity, rate: 0.174 },
];
const MB_BPA = 15780;
// Manitoba's BPA itself phases out for high earners — unusual among the
// provinces modeled here, where only the federal BPA has an equivalent
// high-income phase-out.
const MB_BPA_CLAWBACK_START = 200000;
const MB_BPA_CLAWBACK_END = 400000;

// Newfoundland and Labrador 2026 tax brackets. Budget 2026 increased the
// BPA part-way through the year; the annual 2026 tax-year amount is $13,094
// (the $15,000 figure used in July payroll tables is a withholding catch-up).
const NL_BRACKETS = [
  { upTo: 44678, rate: 0.087 },
  { upTo: 89354, rate: 0.145 },
  { upTo: 159528, rate: 0.158 },
  { upTo: 223340, rate: 0.178 },
  { upTo: 285319, rate: 0.198 },
  { upTo: 570638, rate: 0.208 },
  { upTo: 1141275, rate: 0.213 },
  { upTo: Infinity, rate: 0.218 },
];
const NL_BPA = 13094;

const NS_BRACKETS = [
  { upTo: 30995, rate: 0.0879 },
  { upTo: 61991, rate: 0.1495 },
  { upTo: 97417, rate: 0.1667 },
  { upTo: 157124, rate: 0.175 },
  { upTo: Infinity, rate: 0.21 },
];
const NS_BPA = 11932;
// NS Low-Income Tax Reduction — same style as PEI's, general (not
// senior-specific), family-income-tested.
const NS_LITR_BASE_EACH = 300;
const NS_LITR_THRESHOLD_COUPLE = 15220;
const NS_LITR_REDUCTION_RATE = 0.05;

// New Brunswick 2026 indexed brackets and rates.
const NB_BRACKETS = [
  { upTo: 52333, rate: 0.094 },
  { upTo: 104666, rate: 0.14 },
  { upTo: 193861, rate: 0.16 },
  { upTo: Infinity, rate: 0.195 },
];
const NB_BPA = 13664;
// NB Low-Income Tax Reduction — general, family-income-tested.
const NB_LITR_THRESHOLD_COUPLE = 22358;
const NB_LITR_REDUCTION_RATE = 0.03;
const NB_LITR_MAX_EACH = 817; // derived from the confirmed threshold/zero-out band, halved per spouse below

// Yukon: unusually, uses the FEDERAL Basic Personal Amount directly (not
// its own fixed number) and the federal bracket THRESHOLDS for its first 3
// brackets (confirmed: $58,523 / $117,045 / $181,440 all match federal
// exactly) — only the RATES differ, plus two Yukon-specific brackets above
// that. Its credit rate is its own lowest bracket rate (6.4%), confirmed by
// cross-checking a published federal-vs-territorial credit-amount ratio.
const YT_BRACKETS = [
  { upTo: 58523, rate: 0.064 },
  { upTo: 117045, rate: 0.09 },
  { upTo: 181440, rate: 0.109 },
  { upTo: 500000, rate: 0.128 },
  { upTo: Infinity, rate: 0.15 },
];

// Northwest Territories 2026 tax data.
const NT_BRACKETS = [
  { upTo: 53003, rate: 0.059 },
  { upTo: 106009, rate: 0.086 },
  { upTo: 172346, rate: 0.122 },
  { upTo: Infinity, rate: 0.1405 },
];
const NT_BPA = 18198;

const NU_BRACKETS = [
  { upTo: 55801, rate: 0.04 },
  { upTo: 111602, rate: 0.07 },
  { upTo: 181440, rate: 0.09 },
  { upTo: Infinity, rate: 0.115 },
];
const NU_BPA = 19659;

// NWT and Nunavut both pay a flat Senior Citizen Supplementary Benefit
// (SCSB), automatically included with OAS/GIS for anyone actually
// receiving GIS (not further income-tested beyond that), starting at age
// 60 — not 65, unlike most provincial programs. Confirmed directly from
// each territorial government's own website. Yukon has no equivalent
// program found in research — modeled as relying on federal GIS alone.
const NT_SCSB_MONTHLY = 196;
const NU_SCSB_MONTHLY = 300;

const RRIF_FACTORS = {
  71: 0.0528, 72: 0.054, 73: 0.0553, 74: 0.0567, 75: 0.0582,
  76: 0.0598, 77: 0.0617, 78: 0.0636, 79: 0.0658, 80: 0.0682,
  81: 0.0708, 82: 0.0738, 83: 0.0771, 84: 0.0808, 85: 0.0851,
  86: 0.0899, 87: 0.0955, 88: 0.1021, 89: 0.1099, 90: 0.1192,
  91: 0.1306, 92: 0.1449, 93: 0.1634, 94: 0.1879,
};

function rrifMinFactor(age) {
  if (age >= 95) return 0.2;
  if (age >= 71) return RRIF_FACTORS[age] || 0;
  if (age <= 0 || age >= 90) return 0;
  return 1 / (90 - age);
}

function progressiveTax(income, brackets) {
  let tax = 0, prevCap = 0;
  for (const b of brackets) {
    if (income <= prevCap) break;
    tax += (Math.min(income, b.upTo) - prevCap) * b.rate;
    prevCap = b.upTo;
  }
  return tax;
}

function federalBPA(income) {
  if (income <= FEDERAL_BPA_PHASE_START) return FEDERAL_BPA_MAX;
  if (income >= FEDERAL_BPA_PHASE_END) return FEDERAL_BPA_MIN;
  const frac = (income - FEDERAL_BPA_PHASE_START) / (FEDERAL_BPA_PHASE_END - FEDERAL_BPA_PHASE_START);
  return FEDERAL_BPA_MAX - frac * (FEDERAL_BPA_MAX - FEDERAL_BPA_MIN);
}

function ageAmount(maxAmount, threshold, income) {
  return Math.max(0, maxAmount - 0.15 * Math.max(0, income - threshold));
}

function provincialRetirementCreditAmount(province, taxableIncome, age, federalPensionAmount) {
  const d = RETIREMENT_CREDITS[province];
  if (!d) return 0;
  const ageAmt = age >= 65 ? ageAmount(d.ageMax, d.ageThreshold, taxableIncome) : 0;
  const pensionAmt = Math.min(d.pensionMax, federalPensionAmount);
  return (ageAmt + pensionAmt) * d.rate;
}

function calcOntarioHealthPremium(taxableIncome) {
  const x = Math.max(0, taxableIncome);
  if (x <= 20000) return 0;
  if (x <= 36000) return Math.min(300, 0.06 * (x - 20000));
  if (x <= 48000) return Math.min(450, 300 + 0.06 * (x - 36000));
  if (x <= 72000) return Math.min(600, 450 + 0.25 * (x - 48000));
  if (x <= 200000) return Math.min(750, 600 + 0.25 * (x - 72000));
  return Math.min(900, 750 + 0.25 * (x - 200000));
}

function calcOntarioTaxReduction(provTaxBeforeReduction) {
  // This app models no dependent-child/disability additions, so the standard
  // 2026 basic Ontario Tax Reduction amount is $300.
  const personalAmount = 300;
  return Math.min(provTaxBeforeReduction, Math.max(0, 2 * personalAmount - provTaxBeforeReduction));
}

function calcTaxBase(taxableIncome, province, age, eligiblePensionIncome) {
  const fedGross = progressiveTax(taxableIncome, FEDERAL_BRACKETS);
  const fedAgeAmount = age >= 65 ? ageAmount(FEDERAL_AGE_AMOUNT_MAX, FEDERAL_AGE_AMOUNT_THRESHOLD, taxableIncome) : 0;
  const fedPensionAmount = Math.min(FEDERAL_PENSION_INCOME_MAX, Math.max(0, eligiblePensionIncome || 0));
  const fedCredits = (federalBPA(taxableIncome) + fedAgeAmount + fedPensionAmount) * 0.14;
  let fedTax = Math.max(0, fedGross - fedCredits);

  // Quebec's provincial age/retirement-income amounts are household-income
  // tested and are applied later in computeHouseholdBenefits(). Federal age
  // and pension credits above still apply to Quebec residents.
  if (province === "QC") {
    fedTax = fedTax * (1 - QC_ABATEMENT_RATE);
    const qcGross = progressiveTax(taxableIncome, QC_BRACKETS);
    const provTax = Math.max(0, qcGross - QC_BPA * QC_CREDIT_RATE);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  }

  const provRetirementCredit = provincialRetirementCreditAmount(province, taxableIncome, age, fedPensionAmount);

  if (province === "AB") {
    const abGross = progressiveTax(taxableIncome, AB_BRACKETS);
    const provTax = Math.max(0, abGross - AB_BPA * 0.08 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "PE") {
    const peGross = progressiveTax(taxableIncome, PE_BRACKETS);
    const provTax = Math.max(0, peGross - PE_BPA * 0.095 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "BC") {
    const bcGross = progressiveTax(taxableIncome, BC_BRACKETS);
    const bcAfterCredits = Math.max(0, bcGross - BC_BPA * 0.056 - provRetirementCredit);
    const bcReduction = Math.max(0, BC_REDUCTION_MAX - BC_REDUCTION_RATE * Math.max(0, taxableIncome - BC_REDUCTION_THRESHOLD));
    const provTax = Math.max(0, bcAfterCredits - bcReduction);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "SK") {
    const skGross = progressiveTax(taxableIncome, SK_BRACKETS);
    const seniorSupplementCredit = age >= 65 ? SK_SENIOR_SUPPLEMENT_AMOUNT * 0.105 : 0;
    const provTax = Math.max(0, skGross - SK_BPA * 0.105 - seniorSupplementCredit - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "MB") {
    const mbGross = progressiveTax(taxableIncome, MB_BRACKETS);
    const mbBpaEffective = taxableIncome <= MB_BPA_CLAWBACK_START ? MB_BPA
      : taxableIncome >= MB_BPA_CLAWBACK_END ? 0
      : MB_BPA * (1 - (taxableIncome - MB_BPA_CLAWBACK_START) / (MB_BPA_CLAWBACK_END - MB_BPA_CLAWBACK_START));
    const provTax = Math.max(0, mbGross - mbBpaEffective * 0.108 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "NL") {
    const nlGross = progressiveTax(taxableIncome, NL_BRACKETS);
    const provTax = Math.max(0, nlGross - NL_BPA * 0.087 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "NS") {
    const nsGross = progressiveTax(taxableIncome, NS_BRACKETS);
    const provTax = Math.max(0, nsGross - NS_BPA * 0.0879 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "NB") {
    const nbGross = progressiveTax(taxableIncome, NB_BRACKETS);
    const provTax = Math.max(0, nbGross - NB_BPA * 0.094 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "YT") {
    const ytGross = progressiveTax(taxableIncome, YT_BRACKETS);
    const provTax = Math.max(0, ytGross - federalBPA(taxableIncome) * 0.064 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "NT") {
    const ntGross = progressiveTax(taxableIncome, NT_BRACKETS);
    const provTax = Math.max(0, ntGross - NT_BPA * 0.059 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  } else if (province === "NU") {
    const nuGross = progressiveTax(taxableIncome, NU_BRACKETS);
    const provTax = Math.max(0, nuGross - NU_BPA * 0.04 - provRetirementCredit);
    return { fedTax, provTax, totalTax: fedTax + provTax };
  }

  // Default ON: non-refundable credits reduce basic Ontario tax before surtax;
  // the Ontario Tax Reduction then applies, and the Health Premium is added.
  const onGross = progressiveTax(taxableIncome, ON_BRACKETS);
  const onAfterCredits = Math.max(0, onGross - ON_BPA * 0.0505 - provRetirementCredit);
  const surtax = 0.2 * Math.max(0, onAfterCredits - ON_SURTAX_T1) + 0.36 * Math.max(0, onAfterCredits - ON_SURTAX_T2);
  const beforeReduction = onAfterCredits + surtax;
  const taxReduction = calcOntarioTaxReduction(beforeReduction);
  const healthPremium = calcOntarioHealthPremium(taxableIncome);
  const provTax = Math.max(0, beforeReduction - taxReduction) + healthPremium;
  return { fedTax, provTax, totalTax: fedTax + provTax };
}

// Apply planning inflation uniformly to the 2026 tax system. Calculate in
// 2026-equivalent dollars, then scale the resulting tax back to that year's
// projection dollars. Eligible pension income is scaled the same way so the
// pension-credit limits remain in real 2026 dollars.
function calcTax(taxableIncome, province, age, inflationFactor, eligiblePensionIncome) {
  const f = Math.max(0.0001, inflationFactor || 1);
  const base = calcTaxBase(taxableIncome / f, province, age, (eligiblePensionIncome || 0) / f);
  return { fedTax: base.fedTax * f, provTax: base.provTax * f, totalTax: base.totalTax * f };
}

// =============================================================================
// Pension & Benefits
// =============================================================================
const OAS_START_MIN = 65, OAS_START_MAX = 70;
const CPP_START_MIN = 60, CPP_START_MAX = 70;
const QPP_START_MIN = 60, QPP_START_MAX = 72;
function pensionStartMax(province) { return province === "QC" ? QPP_START_MAX : CPP_START_MAX; }

function oasStartFactor(startAge) {
  const monthsDeferred = Math.max(0, Math.min(startAge, OAS_START_MAX) - 65) * 12;
  return 1 + 0.006 * monthsDeferred;
}

const QPP_MAX_ANNUAL_65_2026 = 1507.65 * 12;
function cppStartFactor(startAge, pensionMax, province, annualAt65) {
  if (startAge < 65) {
    // CPP is a fixed 0.6%/month reduction. QPP ranges from 0.5%-0.6%/month
    // and increases roughly in proportion to the age-65 pension relative to
    // the maximum. This approximation keeps the UI simple while avoiding the
    // former blanket CPP factor for every QPP user.
    let monthlyReduction = 0.006;
    if (province === "QC") {
      const ratio = Math.max(0, Math.min(1, (annualAt65 || 0) / QPP_MAX_ANNUAL_65_2026));
      monthlyReduction = 0.005 + 0.001 * ratio;
    }
    return 1 - monthlyReduction * (65 - Math.max(startAge, CPP_START_MIN)) * 12;
  }
  return 1 + 0.007 * (Math.min(startAge, pensionMax) - 65) * 12;
}
const OAS_AGE75_BONUS = 0.10;
const OAS_CLAWBACK_THRESHOLD = 95323;
const OAS_CLAWBACK_RATE = 0.15;

// Provincial Cash Benefits
const GIS_MAX_SINGLE = 1123.17 * 12;       // spouse does not receive OAS/Allowance
const GIS_MAX_COUPLE_EACH = 676.09 * 12;    // both spouses receive OAS
// July-September 2026 GIS structure. The official tables include separate
// base-GIS and top-up reductions. The app reproduces the standard married
// cases with smooth annual formulas anchored to the published maximums,
// reduction points and cut-offs; exact monthly table rounding can differ by
// a few dollars per year.
const GIS_COUPLE_BASE_MONTHLY = 626.50;
const GIS_COUPLE_TOPUP_MONTHLY = 676.09 - GIS_COUPLE_BASE_MONTHLY;
const GIS_COUPLE_BASE_REDUCTION_POINT = 48;
const GIS_COUPLE_TOPUP_REDUCTION_POINT = 4096;
const GIS_COUPLE_CUTOFF = 30096;
const GIS_NO_OAS_BASE_MONTHLY = 949.50;
const GIS_NO_OAS_TOPUP_MONTHLY = 1123.17 - GIS_NO_OAS_BASE_MONTHLY;
const GIS_NO_OAS_BASE_REDUCTION_POINT = 9072;
const GIS_NO_OAS_TOPUP_REDUCTION_POINT = 4096;
const GIS_NO_OAS_CUTOFF = 54624;

const GAINS_MAX_EACH = 1104;        
const GAINS_REDUCTION_RATE = 0.125; 

const QC_SENIOR_MAX_EACH = 2000;         
const QC_SENIOR_THRESHOLD_COUPLE = 45270; 
const QC_SENIOR_REDUCTION_RATE = 0.054;   

// Alberta Seniors Benefit: this app always models a married couple, so use
// the 2026 homeowner/renter/lodge family maximum and family phase-out rate.
// If both spouses are OAS recipients, the modeled family benefit is split
// equally for charting; if only one spouse is old enough, it is assigned to
// that eligible spouse. Other accommodation categories are not modeled.
const AB_ASB_MAX_COUPLE = 5918;
const AB_ASB_REDUCTION_RATE_COUPLE = 0.1717;

// PEI Low-Income Tax Reduction (LITR): $350 for yourself, $350 more if
// married — no age tier of any kind (confirmed by multiple independent
// sources: "up to $350 for yourself and $350 for a spouse or common-law
// partner," with no age-based increase anywhere in that description).
const PE_LITR_BASE_EACH = 350;
const PE_LITR_THRESHOLD_COUPLE = 23000;
const PE_LITR_REDUCTION_RATE = 0.05;

// BC Senior's Supplement effective January 2026: maximum $99.30/month for
// a single recipient (or recipient whose spouse is not on OAS/GIS/Allowance)
// and $110.25/month EACH when both spouses receive OAS/GIS. The real program
// is keyed to the federal GIS/Allowance amount; below we approximate partial
// payments in proportion to the modeled GIS amount.
const BC_SENIOR_MAX_SINGLE = 99.30 * 12;
const BC_SENIOR_MAX_COUPLE_EACH = 110.25 * 12;

// Saskatchewan Seniors' Supplement: structurally different from every other
// province modeled here — it is NOT income-tested at all. It's simply an
// additional flat non-refundable tax credit amount (like a second Basic
// Personal Amount) for anyone 65+, converted to a credit value at SK's own
// lowest bracket rate — confirmed directly by the Government of
// Saskatchewan's own description of how to compute SK tax. Applied inside
// calcTax itself, not through the cash-benefit dispatcher below.
const SK_SENIOR_SUPPLEMENT_AMOUNT = 2569;

// Manitoba 55 PLUS Program: available from age 55 (not 65), and doesn't
// strictly require OAS receipt (the "Junior Component" serves those not yet
// on OAS; the "Senior Component," for OAS recipients, uses a more complex
// formula tied to OAS/GIS levels that wasn't precisely available — the
// Junior Component's confirmed thresholds are used here as the closest
// available anchor for a linear approximation).
const MB_55PLUS_MAX_COUPLE_EACH = 173.90 * 4; // each eligible married/common-law person
const MB_55PLUS_REDUCTION_RATE_COUPLE_EACH = 0.0428; // simple family-income approximation

// Newfoundland and Labrador Seniors' Benefit, effective July 2026. Eligibility
// is age/family-income based; it does not require the person to be receiving
// OAS. Maximum is $1,882 through family net income of $30,409, then phases
// out at 11.66% to approximately $46,550.
const NL_SENIOR_MAX_EACH = 1882;
const NL_SENIOR_THRESHOLD = 30409;
const NL_SENIOR_REDUCTION_RATE = 0.1166;

function calcGIS(personOasStarted, spouseOasStarted, combinedGisIncome) {
  if (!personOasStarted) return 0;
  const income = Math.max(0, combinedGisIncome);

  if (spouseOasStarted) {
    if (income >= GIS_COUPLE_CUTOFF) return 0;
    const base = Math.max(0,
      GIS_COUPLE_BASE_MONTHLY * 12 - 0.25 * Math.max(0, income - GIS_COUPLE_BASE_REDUCTION_POINT));
    const topUp = Math.max(0,
      GIS_COUPLE_TOPUP_MONTHLY * 12 - 0.125 * Math.max(0, income - GIS_COUPLE_TOPUP_REDUCTION_POINT));
    return Math.min(GIS_MAX_COUPLE_EACH, base + topUp);
  }

  if (income >= GIS_NO_OAS_CUTOFF) return 0;
  const base = Math.max(0,
    GIS_NO_OAS_BASE_MONTHLY * 12 - 0.25 * Math.max(0, income - GIS_NO_OAS_BASE_REDUCTION_POINT));
  const topUp = Math.max(0,
    GIS_NO_OAS_TOPUP_MONTHLY * 12 - 0.125 * Math.max(0, income - GIS_NO_OAS_TOPUP_REDUCTION_POINT));
  return Math.min(GIS_MAX_SINGLE, base + topUp);
}

function calcGAINS(personOasStarted, combinedGisIncome) {
  if (!personOasStarted) return 0;
  return Math.max(0, GAINS_MAX_EACH - GAINS_REDUCTION_RATE * combinedGisIncome);
}

function calcSeniorAssistance(personAge, spouseAge, combinedFamilyIncome) {
  if (personAge < 70) return 0;
  const spouseEligible = spouseAge >= 70;
  const reductionRate = spouseEligible ? (QC_SENIOR_REDUCTION_RATE / 2) : QC_SENIOR_REDUCTION_RATE;
  return Math.max(0, QC_SENIOR_MAX_EACH - reductionRate * Math.max(0, combinedFamilyIncome - QC_SENIOR_THRESHOLD_COUPLE));
}

function calcASB(personOasStarted, personAge, spouseAge, spouseOasStarted, combinedGisIncome) {
  if (personAge < 65 || !personOasStarted) return 0;
  // If the spouse is already 65+ but has deferred OAS, Alberta says the
  // household is not eligible for seniors financial assistance.
  if (spouseAge >= 65 && !spouseOasStarted) return 0;
  const familyBenefit = Math.max(0, AB_ASB_MAX_COUPLE - AB_ASB_REDUCTION_RATE_COUPLE * combinedGisIncome);
  return spouseOasStarted ? familyBenefit / 2 : familyBenefit;
}

function calcPeiLitr(spouseAge, combinedFamilyNetIncome) {
  if (state.province !== "PE") return 0;
  const hasSpouse = true; // this app always models a married couple
  const familyMax = PE_LITR_BASE_EACH + (hasSpouse ? PE_LITR_BASE_EACH : 0);
  const familyReduction = Math.max(0, familyMax - PE_LITR_REDUCTION_RATE * Math.max(0, combinedFamilyNetIncome - PE_LITR_THRESHOLD_COUPLE));
  return familyReduction / 2; // Each spouse gets half to offset their provincial tax
}

function calcBcSenior(personOasStarted, spouseOasStarted, personGis) {
  if (!personOasStarted || personGis <= 0) return 0;
  const max = spouseOasStarted ? BC_SENIOR_MAX_COUPLE_EACH : BC_SENIOR_MAX_SINGLE;
  const gisMax = spouseOasStarted ? GIS_MAX_COUPLE_EACH : GIS_MAX_SINGLE;
  const gisShare = Math.max(0, Math.min(1, personGis / gisMax));
  return max * gisShare;
}

function calcMb55Plus(personAge, combinedGisIncome) {
  if (personAge < 55) return 0;
  return Math.max(0, MB_55PLUS_MAX_COUPLE_EACH - MB_55PLUS_REDUCTION_RATE_COUPLE_EACH * combinedGisIncome);
}

function calcNlSenior(personAge, combinedFamilyNetIncome) {
  if (personAge < 65) return 0;
  return Math.max(0, NL_SENIOR_MAX_EACH - NL_SENIOR_REDUCTION_RATE * Math.max(0, combinedFamilyNetIncome - NL_SENIOR_THRESHOLD));
}

function calcNsLitr(combinedFamilyNetIncome) {
  if (state.province !== "NS") return 0;
  const familyMax = NS_LITR_BASE_EACH * 2; // this app always models a married couple
  const familyReduction = Math.max(0, familyMax - NS_LITR_REDUCTION_RATE * Math.max(0, combinedFamilyNetIncome - NS_LITR_THRESHOLD_COUPLE));
  return familyReduction / 2;
}

function calcNbLitr(combinedFamilyNetIncome) {
  if (state.province !== "NB") return 0;
  const familyMax = NB_LITR_MAX_EACH * 2;
  const familyReduction = Math.max(0, familyMax - NB_LITR_REDUCTION_RATE * Math.max(0, combinedFamilyNetIncome - NB_LITR_THRESHOLD_COUPLE));
  return familyReduction / 2;
}

function calcNtScsb(personAge, personGis) {
  if (personAge < 60 || personGis <= 0) return 0;
  return NT_SCSB_MONTHLY * 12;
}

function calcNuScsb(personAge, personGis) {
  if (personAge < 60 || personGis <= 0) return 0;
  return NU_SCSB_MONTHLY * 12;
}

function calcProvincialTopUp(province, personOasStarted, personAge, spouseAge, spouseOasStarted, combinedGisIncome, combinedFamilyIncomeInclOasGross, personGis) {
  if (province === "QC") return calcSeniorAssistance(personAge, spouseAge, combinedFamilyIncomeInclOasGross);
  if (province === "AB") return calcASB(personOasStarted, personAge, spouseAge, spouseOasStarted, combinedGisIncome);
  if (province === "BC") return calcBcSenior(personOasStarted, spouseOasStarted, personGis);
  if (province === "MB") return calcMb55Plus(personAge, combinedGisIncome);
  if (province === "NL") return calcNlSenior(personAge, combinedFamilyIncomeInclOasGross);
  if (province === "NT") return calcNtScsb(personAge, personGis);
  if (province === "NU") return calcNuScsb(personAge, personGis);
  if (province === "PE") return 0; // Handled natively as a tax reduction
  if (province === "SK") return 0; // Handled natively as a flat non-income-tested tax credit
  if (province === "NS") return 0; // Handled natively as a tax reduction
  if (province === "NB") return 0; // Handled natively as a tax reduction
  if (province === "YT") return 0; // No territorial top-up found in research; relies on federal GIS alone
  return calcGAINS(personOasStarted, combinedGisIncome); // Default ON
}

const TFSA_COLOR = "#A8447A";
const SELF_COLOR = "#3B6E8F";
const SPOUSE_COLOR = "#C2617A";

// =============================================================================
// Simulation
// =============================================================================
const DEFAULT_PERSON = {
  retireAge: 65,
  regAccountK: 0, acbPct: 50, retRegPct: 6.0, regStartAge: 65, wdReg0: 0, wdReg65: 0,
  rrspAccountK: 0, retRrspPct: 5.5, rrspStartAge: 65, wdRrsp0: 0, wdRrsp65: 0,
  tfsaAccountK: 0, tfsaStartAge: 65, retTfsaPct: 6.0, wdTfsa0: 0, wdTfsa65: 0,
  oasAnnualK: 8.9, oasStartAge: 65, yearsInCanada: 40,
  cppAnnualK: 16, cppStartAge: 65, 
  pensionAnnualK: 0, pensionStartAge: 65, pensionChangePct: 0,
  otherIncomeK: 0, otherChangePct: 0,
};

function midYearAccount(openBalance, annualReturn, targetWithdrawal) {
  const open = Math.max(0, openBalance);
  const target = Math.max(0, targetWithdrawal);
  // Approximate withdrawals as occurring evenly through the year: half the
  // annual withdrawal is treated as invested for half a year. This avoids
  // the old year-end-withdrawal bias without adding monthly complexity.
  const denom = 1 + annualReturn / 2;
  let capacity;
  if (denom > 0) capacity = Math.max(0, open * (1 + annualReturn) / denom);
  else capacity = open;
  const withdrawal = Math.min(target, capacity);
  const growth = (open - withdrawal / 2) * annualReturn;
  const close = Math.max(0, open + growth - withdrawal);
  const midValueBeforeWithdrawal = Math.max(0, open * (1 + annualReturn / 2));
  return { withdrawal, growth, close, midValueBeforeWithdrawal };
}

function simulate(inputs) {
  const {
    startAge, retireAge, regAccount0, rrspAccount0, acbPct,
    retReg, retRRSP, wdReg0, wdReg65, wdRRSP0, wdRRSP65, regStartAge, rrspStartAge,
    tfsaAccount0, tfsaStartAge, retTfsa, wdTfsa0, wdTfsa65,
    oasAnnual65, oasStartAge, yearsInCanada, cppAnnual65, cppStartAge, otherIncome0, otherChange,
    pensionAnnual0, pensionStartAge, pensionChange, province, horizon, inflationRate,
  } = inputs;

  let regBal = 0;
  let regACB = 0;
  let rrspBal = 0;
  let tfsaBal = 0;
  let retirementBalancesActivated = false;

  const oasResidencyFactor = yearsInCanada < 10 ? 0 : Math.min(yearsInCanada, 40) / 40;
  const oasBase = oasAnnual65 * oasResidencyFactor * oasStartFactor(oasStartAge);
  const cppBase = cppAnnual65 * cppStartFactor(cppStartAge, pensionStartMax(province), province, cppAnnual65);

  const rows = [];

  for (let y = 1; y <= horizon; y++) {
    const age = startAge + y - 1;
    const inflationFactor = Math.pow(1 + inflationRate, y - 1);

    // Inputs labelled “Balance at Retire” enter the common household timeline
    // only when this person actually reaches their own retirement age.
    if (!retirementBalancesActivated && age >= retireAge) {
      regBal = regAccount0;
      regACB = regBal * (acbPct / 100);
      rrspBal = rrspAccount0;
      tfsaBal = tfsaAccount0;
      retirementBalancesActivated = true;
    }

    const regTarget = age < regStartAge ? 0 : (age >= 65 ? wdReg65 : wdReg0);
    const rrspTargetBase = age < rrspStartAge ? 0 : (age >= 65 ? wdRRSP65 : wdRRSP0);
    const factor = rrifMinFactor(age - 1);
    const isRrifEstablishmentYear = age === rrspStartAge;
    const rrifEstablished = age >= rrspStartAge;
    const rrifMin = factor && rrifEstablished && !isRrifEstablishmentYear ? rrspBal * factor : 0;
    const rrspTarget = Math.max(rrspTargetBase, rrifMin);
    const minApplied = rrifMin > rrspTargetBase;

    const regYear = midYearAccount(regBal, retReg, regTarget);
    const rrspYear = midYearAccount(rrspBal, retRRSP, rrspTarget);
    const regWD = regYear.withdrawal, regGrowth = regYear.growth, regClose = regYear.close;
    const rrspWD = rrspYear.withdrawal, rrspGrowth = rrspYear.growth, rrspClose = rrspYear.close;

    let gainRealized = 0, taxableGain = 0;
    if (regYear.midValueBeforeWithdrawal > 0 && regWD > 0) {
      const gainRatio = Math.max(0, (regYear.midValueBeforeWithdrawal - regACB) / regYear.midValueBeforeWithdrawal);
      gainRealized = regWD * gainRatio;
      taxableGain = gainRealized * 0.5;
      const acbReduction = regWD * Math.min(1, regACB / regYear.midValueBeforeWithdrawal);
      regACB = Math.max(0, regACB - acbReduction);
    }

    const tfsaTarget = age < tfsaStartAge ? 0 : (age >= 65 ? wdTfsa65 : wdTfsa0);
    const tfsaYear = midYearAccount(tfsaBal, retTfsa, tfsaTarget);
    const tfsaWD = tfsaYear.withdrawal, tfsaGrowth = tfsaYear.growth, tfsaClose = tfsaYear.close;

    const cpp = age >= cppStartAge ? cppBase * inflationFactor : 0;
    let oasGross = 0;
    if (age >= oasStartAge) {
      oasGross = oasBase * inflationFactor;
      if (age >= 75) oasGross *= 1 + OAS_AGE75_BONUS;
    }
    
    const yearsSinceRetirement = age - retireAge;
    const otherIncomeGrowthFactor = yearsSinceRetirement >= 1 ? Math.pow(1 + otherChange, yearsSinceRetirement) : 1;
    const otherIncomeThisYear = age >= retireAge ? otherIncome0 * otherIncomeGrowthFactor : 0;
    
    const pensionYearsActive = age >= pensionStartAge ? age - pensionStartAge + 1 : 0;
    const pensionGrowthFactor = pensionYearsActive >= 2 ? Math.pow(1 + pensionChange, pensionYearsActive - 1) : 1;
    const pensionThisYear = pensionYearsActive > 0 ? pensionAnnual0 * pensionGrowthFactor : 0;

    const netIncomeForClawback = rrspWD + taxableGain + cpp + oasGross + otherIncomeThisYear + pensionThisYear;
    const oasClawbackThreshold = OAS_CLAWBACK_THRESHOLD * inflationFactor;
    const oasClawback = oasGross > 0 ? Math.min(oasGross, Math.max(0, OAS_CLAWBACK_RATE * (netIncomeForClawback - oasClawbackThreshold))) : 0;
    const oasNet = oasGross - oasClawback;

    const taxableIncome = rrspWD + taxableGain + cpp + oasNet + otherIncomeThisYear + pensionThisYear;
    // Employer pension income is treated as qualifying pension income; RRIF
    // withdrawals are treated as qualifying from age 65 onward. CPP/QPP and
    // OAS do not qualify for the pension income amount.
    const eligiblePensionIncome = pensionThisYear + (age >= 65 ? rrspWD : 0);
    const { fedTax, provTax, totalTax } = calcTax(taxableIncome, province, age, inflationFactor, eligiblePensionIncome);

    const totalIncome = regWD + rrspWD + tfsaWD + cpp + oasNet + otherIncomeThisYear + pensionThisYear;
    const gisIncome = rrspWD + taxableGain + cpp + otherIncomeThisYear + pensionThisYear;

    rows.push({
      year: y, age,
      regOpen: regBal, regGrowth, regWD, gainRealized, taxableGain, regClose,
      rrspOpen: rrspBal, rrspGrowth, rrspWD, minApplied, rrspClose,
      tfsaOpen: tfsaBal, tfsaGrowth, tfsaWD, tfsaClose,
      cpp, oasGross, oasClawback, oasNet, otherIncome: otherIncomeThisYear, pension: pensionThisYear,
      taxableIncome, eligiblePensionIncome, fedTax, provTax, totalTax, totalIncome, gisIncome, inflationFactor,
    });

    regBal = regClose; rrspBal = rrspClose; tfsaBal = tfsaClose;
  }

  return { rows };
}

function simulatePerson(p, startAgeOverride) {
  return simulate({
    startAge: startAgeOverride, retireAge: p.retireAge,
    regAccount0: p.regAccountK * 1000, rrspAccount0: p.rrspAccountK * 1000, acbPct: p.acbPct,
    retReg: p.retRegPct / 100, regStartAge: p.regStartAge,
    retRRSP: p.retRrspPct / 100, rrspStartAge: p.rrspStartAge,
    wdReg0: p.wdReg0 * 1000, wdReg65: p.wdReg65 * 1000,
    wdRRSP0: p.wdRrsp0 * 1000, wdRRSP65: p.wdRrsp65 * 1000,
    tfsaAccount0: p.tfsaAccountK * 1000, tfsaStartAge: p.tfsaStartAge,
    retTfsa: p.retTfsaPct / 100, wdTfsa0: p.wdTfsa0 * 1000, wdTfsa65: p.wdTfsa65 * 1000,
    oasAnnual65: p.oasAnnualK * 1000, oasStartAge: p.oasStartAge, yearsInCanada: p.yearsInCanada,
    cppAnnual65: p.cppAnnualK * 1000, cppStartAge: p.cppStartAge,
    otherIncome0: p.otherIncomeK * 1000, otherChange: p.otherChangePct / 100,
    pensionAnnual0: p.pensionAnnualK * 1000, pensionStartAge: p.pensionStartAge, pensionChange: p.pensionChangePct / 100,
    province: state.province, horizon: state.horizon, inflationRate: state.inflationPct / 100,
  });
}

function calcQcRetirementTaxReductionForPerson(personAge, spouseAge, personEligiblePensionIncome, spouseEligiblePensionIncome, combinedFamilyNetIncome) {
  const personRaw = (personAge >= 65 ? QC_AGE_AMOUNT : 0)
    + Math.min(QC_RETIREMENT_INCOME_MAX, Math.max(0, personEligiblePensionIncome) * 1.25);
  const spouseRaw = (spouseAge >= 65 ? QC_AGE_AMOUNT : 0)
    + Math.min(QC_RETIREMENT_INCOME_MAX, Math.max(0, spouseEligiblePensionIncome) * 1.25);
  const totalRaw = personRaw + spouseRaw;
  if (totalRaw <= 0) return 0;
  const familyReduction = QC_RETIREMENT_REDUCTION_RATE * Math.max(0, combinedFamilyNetIncome - QC_RETIREMENT_REDUCTION_THRESHOLD);
  const allowedTotal = Math.max(0, totalRaw - familyReduction);
  const personAllowed = allowedTotal * (personRaw / totalRaw);
  return personAllowed * QC_CREDIT_RATE;
}

function computeHouseholdBenefitForPair(pRow, sRow) {
  const personOasStarted = pRow.oasGross > 0;
  const spouseOasStarted = sRow.oasGross > 0;
  const combinedGisIncome = pRow.gisIncome + sRow.gisIncome;
  const combinedFamilyIncomeInclOasGross = pRow.gisIncome + pRow.oasGross + sRow.gisIncome + sRow.oasGross;
  const combinedNetIncomeForLITR = pRow.taxableIncome + sRow.taxableIncome; // Line 23600 approximation
  const inflationFactor = pRow.inflationFactor || 1;
  const gisIncomeBase = combinedGisIncome / inflationFactor;
  const familyIncomeBase = combinedFamilyIncomeInclOasGross / inflationFactor;
  const litrIncomeBase = combinedNetIncomeForLITR / inflationFactor;

  const gisBase = personOasStarted ? calcGIS(personOasStarted, spouseOasStarted, gisIncomeBase) : 0;
  const topUpBase = calcProvincialTopUp(state.province, personOasStarted, pRow.age, sRow.age, spouseOasStarted, gisIncomeBase, familyIncomeBase, gisBase);
  const gis = gisBase * inflationFactor;
  const topUp = topUpBase * inflationFactor;

  const qcRetirementReductionBase = state.province === "QC"
    ? calcQcRetirementTaxReductionForPerson(
        pRow.age, sRow.age,
        (pRow.eligiblePensionIncome || 0) / inflationFactor,
        (sRow.eligiblePensionIncome || 0) / inflationFactor,
        litrIncomeBase)
    : 0;
  const taxReduction = (qcRetirementReductionBase
    + calcPeiLitr(sRow.age, litrIncomeBase)
    + calcNsLitr(litrIncomeBase)
    + calcNbLitr(litrIncomeBase)) * inflationFactor;

  return { gis, topUp, taxReduction, peiLitr: taxReduction };
}

function computeHouseholdBenefits(personRows, spouseRows) {
  return personRows.map((pRow, i) => computeHouseholdBenefitForPair(pRow, spouseRows[i]));
}

// Rebuild the tax-sensitive portion of one simulated row. Pension splitting
// changes tax reporting, credits and OAS recovery, but does not move the
// underlying pension/RRIF cash between spouses. An optional extra RRIF amount
// is used only for the educational marginal-withdrawal estimate.
function recalcTaxSensitiveRow(row, splitOut, splitIn, extraRrif) {
  splitOut = Math.max(0, splitOut || 0);
  splitIn = Math.max(0, splitIn || 0);
  extraRrif = Math.max(0, extraRrif || 0);

  const rrspWD = row.rrspWD + extraRrif;
  const taxableGain = row.taxableGain != null ? row.taxableGain : (row.gainRealized || 0) * 0.5;
  const splitNet = splitIn - splitOut;
  const inflationFactor = row.inflationFactor || 1;
  const oasClawbackThreshold = OAS_CLAWBACK_THRESHOLD * inflationFactor;
  const netIncomeForClawback = rrspWD + taxableGain + row.cpp + row.oasGross + row.otherIncome + row.pension + splitNet;
  const oasClawback = row.oasGross > 0
    ? Math.min(row.oasGross, Math.max(0, OAS_CLAWBACK_RATE * (netIncomeForClawback - oasClawbackThreshold)))
    : 0;
  const oasNet = row.oasGross - oasClawback;
  const taxableIncome = rrspWD + taxableGain + row.cpp + oasNet + row.otherIncome + row.pension + splitNet;

  // This app assumes employer pension income is qualifying pension income.
  // RRIF income is treated as qualifying from age 65 onward. CPP/QPP and OAS
  // are not eligible for the pension-income split.
  const eligibleBeforeSplit = row.pension + (row.age >= 65 ? rrspWD : 0);
  const eligiblePensionIncome = Math.max(0, eligibleBeforeSplit - splitOut + splitIn);
  const tax = calcTax(taxableIncome, state.province, row.age, inflationFactor, eligiblePensionIncome);

  const totalIncome = row.regWD + rrspWD + row.tfsaWD + row.cpp + oasNet + row.otherIncome + row.pension;
  const gisIncome = rrspWD + taxableGain + row.cpp + row.otherIncome + row.pension;

  return Object.assign({}, row, {
    rrspWD, taxableGain, oasClawback, oasNet, taxableIncome,
    eligiblePensionIncome, fedTax: tax.fedTax, provTax: tax.provTax,
    totalTax: tax.totalTax, totalIncome, gisIncome,
    pensionSplitOut: splitOut, pensionSplitIn: splitIn,
    pensionSplitNet: splitNet,
  });
}

function householdTaxAndRecovery(pRow, sRow) {
  const pBenefit = computeHouseholdBenefitForPair(pRow, sRow);
  const sBenefit = computeHouseholdBenefitForPair(sRow, pRow);
  const pProvTax = Math.max(0, pRow.provTax - pBenefit.taxReduction);
  const sProvTax = Math.max(0, sRow.provTax - sBenefit.taxReduction);
  const pIncomeTax = pRow.fedTax + pProvTax;
  const sIncomeTax = sRow.fedTax + sProvTax;
  return {
    burden: pIncomeTax + sIncomeTax + pRow.oasClawback + sRow.oasClawback,
    pBenefit, sBenefit, pIncomeTax, sIncomeTax,
  };
}

// CRA permits one spouse to allocate up to 50% of eligible pension income to
// the other spouse for a year. To avoid adding settings, the planner tests
// both legal directions in 1-percentage-point steps and uses the option that
// minimizes modeled combined income tax plus OAS recovery tax.
function optimizePensionSplitPair(pRaw, sRaw, extraPRrif, extraSRrif) {
  extraPRrif = Math.max(0, extraPRrif || 0);
  extraSRrif = Math.max(0, extraSRrif || 0);

  const pEligible = pRaw.pension + (pRaw.age >= 65 ? pRaw.rrspWD + extraPRrif : 0);
  const sEligible = sRaw.pension + (sRaw.age >= 65 ? sRaw.rrspWD + extraSRrif : 0);

  function evaluate(pOut, pIn, sOut, sIn) {
    const pRow = recalcTaxSensitiveRow(pRaw, pOut, pIn, extraPRrif);
    const sRow = recalcTaxSensitiveRow(sRaw, sOut, sIn, extraSRrif);
    const household = householdTaxAndRecovery(pRow, sRow);
    return Object.assign({ pRow, sRow }, household);
  }

  let best = evaluate(0, 0, 0, 0);
  best.direction = 'none'; best.amount = 0;
  const EPS = 0.01;

  for (let k = 1; k <= 50; k++) {
    if (pEligible > 0) {
      const amount = pEligible * k / 100;
      const cand = evaluate(amount, 0, 0, amount);
      if (cand.burden + EPS < best.burden) {
        best = cand; best.direction = 'primary-to-spouse'; best.amount = amount;
      }
    }
    if (sEligible > 0) {
      const amount = sEligible * k / 100;
      const cand = evaluate(0, amount, amount, 0);
      if (cand.burden + EPS < best.burden) {
        best = cand; best.direction = 'spouse-to-primary'; best.amount = amount;
      }
    }
  }
  return best;
}

function optimizePensionSplittingRows(personRows, spouseRows) {
  const primaryRows = [], secondaryRows = [], primaryBenefits = [], secondaryBenefits = [];
  for (let i = 0; i < personRows.length; i++) {
    const best = optimizePensionSplitPair(personRows[i], spouseRows[i], 0, 0);
    primaryRows.push(best.pRow); secondaryRows.push(best.sRow);
    primaryBenefits.push(best.pBenefit); secondaryBenefits.push(best.sBenefit);
  }
  return { primaryRows, secondaryRows, primaryBenefits, secondaryBenefits };
}

function afterTaxHouseholdCash(opt) {
  return opt.pRow.totalIncome + opt.pBenefit.gis + opt.pBenefit.topUp - opt.pIncomeTax
    + opt.sRow.totalIncome + opt.sBenefit.gis + opt.sBenefit.topUp - opt.sIncomeTax;
}

function effectiveMarginalRrifWithdrawalRate(personRaw, spouseRaw) {
  const DELTA = 1000;
  const base = optimizePensionSplitPair(personRaw, spouseRaw, 0, 0);
  const more = optimizePensionSplitPair(personRaw, spouseRaw, DELTA, 0);
  const netCashGain = afterTaxHouseholdCash(more) - afterTaxHouseholdCash(base);
  return (1 - netCashGain / DELTA) * 100;
}

const fmtK = new Intl.NumberFormat("en-CA", { maximumFractionDigits: 0 });
function fmtPct1(v) { return (v * 100).toFixed(1) + "%"; }
const fmtDollar = new Intl.NumberFormat("en-CA", { maximumFractionDigits: 0 });
function money(v) {
  // Values under $1,000 (in either direction) are shown in whole dollars
  // rather than $K — otherwise a real, correctly-computed benefit like a
  // $104 GAINS payment rounds to "$0K", which looks exactly like a benefit
  // that isn't being paid at all, even though it's genuinely nonzero and
  // is already included in the Gross/Net income totals.
  if (Math.abs(v) < 1000) {
    const s = "$" + fmtDollar.format(Math.abs(v));
    return v < 0 ? "(" + s + ")" : s;
  }
  const s = "$" + fmtK.format(Math.abs(v) / 1000) + "K";
  return v < 0 ? "(" + s + ")" : s;
}

// Chart tooltip ("floating panel") formatter: always $K with exactly 1
// decimal place, for consistent precision across every figure shown on
// hover/tap — distinct from money(), which the ledger table uses.
const fmtK1 = new Intl.NumberFormat("en-CA", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function moneyTooltip(v) {
  const s = "$" + fmtK1.format(Math.abs(v) / 1000) + "K";
  return v < 0 ? "(" + s + ")" : s;
}

function wireControls() {
  document.getElementById('btnSelf').addEventListener('click', () => selectPerson('self'));
  document.getElementById('btnSpouse').addEventListener('click', () => selectPerson('spouse'));

  document.querySelectorAll('#controls .section-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-toggle-key');
      state.collapsed[key] = !state.collapsed[key];
      renderControls();
    });
  });

  const wa = document.getElementById('spouseAgeAtSelfRetire');
  wa.addEventListener('input', () => {
    const raw = parseFloat(wa.value);
    if (!isNaN(raw)) state.ageGap = Math.round(raw) - state.self.retireAge;
    syncFieldsFromState();
    renderResults();
  });
  wa.addEventListener('blur', () => {
    let v = parseFloat(wa.value);
    if (isNaN(v)) v = state.self.retireAge + state.ageGap;
    v = Math.min(Math.max(Math.round(v), 18), 100);
    state.ageGap = v - state.self.retireAge;
    wa.value = v;
    syncFieldsFromState();
    renderResults();
  });

  const yp = document.getElementById('planningHorizon');
  yp.addEventListener('input', () => {
    const raw = parseFloat(yp.value);
    if (!isNaN(raw)) state.horizon = Math.round(raw);
    renderResults();
  });
  yp.addEventListener('blur', () => {
    let v = parseFloat(yp.value);
    if (isNaN(v)) v = state.horizon;
    v = Math.min(Math.max(Math.round(v), 5), 40);
    state.horizon = v;
    yp.value = v;
    renderResults();
    renderIntro();
    renderAssumptions();
  });

  const inf = document.getElementById('inflationPct');
  inf.addEventListener('input', () => {
    const raw = parseFloat(inf.value);
    if (!isNaN(raw)) state.inflationPct = Math.min(Math.max(raw, 0), 10);
    renderResults();
  });
  inf.addEventListener('blur', () => {
    let v = parseFloat(inf.value);
    if (isNaN(v)) v = state.inflationPct;
    v = Math.min(Math.max(v, 0), 10);
    state.inflationPct = v;
    inf.value = v;
    renderResults();
    renderAssumptions();
  });

  FIELD_DEFS.forEach(wireField);
}

function wireField(def) {
  const el = document.getElementById(def.id);
  if (!el) return;
  el.addEventListener('input', () => {
    const raw = parseFloat(el.value);
    if (!isNaN(raw)) {
      const p = getPerson();
      def.set(p, def.round ? Math.round(raw) : raw);
    }
    syncFieldsFromState();
    renderResults();
  });
  el.addEventListener('blur', () => {
    const p = getPerson();
    let v = parseFloat(el.value);
    if (isNaN(v)) v = def.get(p);
    const min = typeof def.min === 'function' ? def.min(p) : def.min;
    const max = typeof def.max === 'function' ? def.max(p) : def.max;
    if (min != null) v = Math.max(v, min);
    if (max != null) v = Math.min(v, max);
    if (def.round) v = Math.round(v);
    def.set(p, v);
    el.value = def.get(p);
    syncFieldsFromState();
    renderResults();
  });
}

function syncFieldsFromState() {
  const p = getPerson();
  const active = document.activeElement;
  FIELD_DEFS.forEach(def => {
    const el = document.getElementById(def.id);
    if (!el || el === active) return;
    const val = def.get(p);
    if (String(el.value) !== String(val)) el.value = val;
    if (def.min != null) el.min = typeof def.min === 'function' ? def.min(p) : def.min;
    if (def.max != null) el.max = typeof def.max === 'function' ? def.max(p) : def.max;
  });
  const waEl = document.getElementById('spouseAgeAtSelfRetire');
  if (waEl && waEl !== active) {
    waEl.value = state.self.retireAge + state.ageGap;
  }
}

function selectPerson(who) {
  state.selectedPerson = who;
  renderControls();
  renderResults();
}

// =============================================================================
// Chart rendering 
// =============================================================================
function getTooltipEl() { return document.getElementById('tooltip'); }

function legendHTML(series) {
  let h = '<div class="chart-legend">';
  series.forEach(s => {
    if (s.isLine) h += '<span class="legend-item"><span class="legend-line" style="background:' + s.color + '"></span>' + s.name + '</span>';
    else h += '<span class="legend-item"><span class="legend-dot" style="background:' + s.color + '"></span>' + s.name + '</span>';
  });
  return h + '</div>';
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function positionTooltip(tooltip, x, y) {
  const pad = 10;
  tooltip.style.left = '0px';
  tooltip.style.top = '0px';
  const w = tooltip.offsetWidth || 240, h = tooltip.offsetHeight || 120;
  let left = x + 14, top = y + 14;
  if (left + w + pad > window.innerWidth) left = Math.max(pad, x - w - 14);
  if (top + h + pad > window.innerHeight) top = Math.max(pad, y - h - 14);
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function buildChart(containerId, data, barSeries, lineSeries, tooltipHTML, xLabelPrefix, markerOpts, opts) {
  opts = opts || {};
  const dualAxis = !!opts.dualAxis;
  const hasAnyValue = key => data.some(d => (d[key] || 0) !== 0);
  barSeries = barSeries.filter(s => hasAnyValue(s.key));
  lineSeries = lineSeries.filter(s => hasAnyValue(s.key));
  const showMarkers = markerOpts && hasAnyValue(markerOpts.key);
  const usesRightAxis = s => dualAxis && !s.useLeftAxis;
  const hasRightAxisLines = lineSeries.some(usesRightAxis);

  const container = document.getElementById(containerId);
  const width = Math.max(280, container.clientWidth || 500);
  const height = 220;
  const marginLeft = 46, marginRight = hasRightAxisLines ? 46 : 10, marginTop = 8, marginBottom = 22;
  const plotW = Math.max(10, width - marginLeft - marginRight);
  const plotH = height - marginTop - marginBottom;
  const n = data.length;
  const step = n > 0 ? plotW / n : plotW;
  const barW = Math.max(1, step * 0.6);

  let maxYBar = 0, maxYLine = 0;
  data.forEach(d => {
    let sum = 0;
    barSeries.forEach(s => sum += (d[s.key] || 0));
    if (sum > maxYBar) maxYBar = sum;
    lineSeries.forEach(s => {
      const v = d[s.key] || 0;
      if (usesRightAxis(s)) { if (v > maxYLine) maxYLine = v; }
      else { if (v > maxYBar) maxYBar = v; }
    });
  });
  if (maxYBar <= 0) maxYBar = 1;
  maxYBar *= 1.1;
  if (hasRightAxisLines) {
    if (maxYLine <= 0) maxYLine = 1;
    maxYLine *= 1.1;
  }

  const yScale = v => marginTop + plotH - (v / maxYBar) * plotH;
  const yScaleRight = hasRightAxisLines ? (v => marginTop + plotH - (v / maxYLine) * plotH) : yScale;
  const yScaleFor = s => usesRightAxis(s) ? yScaleRight : yScale;
  const xScale = i => marginLeft + i * step + step / 2;

  let gridSvg = '';
  for (let t = 0; t <= 4; t++) {
    const val = maxYBar * t / 4;
    const y = yScale(val);
    gridSvg += '<line x1="' + marginLeft + '" y1="' + y.toFixed(1) + '" x2="' + (marginLeft + plotW) + '" y2="' + y.toFixed(1) + '" stroke="#EDEBE3" stroke-dasharray="3,3"></line>';
    gridSvg += '<text x="' + (marginLeft - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="11" fill="#2E3540">' + Math.round(val / 1000) + 'k</text>';
    if (hasRightAxisLines) {
      const valLine = maxYLine * t / 4;
      const yLine = yScaleRight(valLine);
      const rightLabel = opts.rightAxisFormat === 'percent' ? valLine.toFixed(1) + '%' : Math.round(valLine / 1000) + 'k';
      gridSvg += '<text x="' + (marginLeft + plotW + 6) + '" y="' + (yLine + 3).toFixed(1) + '" text-anchor="start" font-size="11" fill="#2E3540">' + rightLabel + '</text>';
    }
  }

  const xTickEvery = Math.max(1, Math.ceil(n / 9));
  let xTicksSvg = '';
  data.forEach((d, i) => {
    if (i % xTickEvery === 0 || i === n - 1) {
      xTicksSvg += '<text x="' + xScale(i).toFixed(1) + '" y="' + (height - marginBottom + 14) + '" text-anchor="middle" font-size="11" fill="#2E3540">' + d.age + '</text>';
    }
  });

  let barsSvg = '';
  data.forEach((d, i) => {
    let cum = 0;
    barSeries.forEach(s => {
      const val = d[s.key] || 0;
      const y0 = yScale(cum), y1 = yScale(cum + val);
      cum += val;
      barsSvg += '<rect x="' + (xScale(i) - barW / 2).toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, y0 - y1).toFixed(1) + '" fill="' + s.color + '"></rect>';
    });
  });

  let linesSvg = '';
  lineSeries.forEach(s => {
    const scale = yScaleFor(s);
    const pts = data.map((d, i) => xScale(i).toFixed(1) + ',' + scale(d[s.key] || 0).toFixed(1)).join(' ');
    linesSvg += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2"></polyline>';
    data.forEach((d, i) => {
      const flagged = showMarkers && markerOpts.lineKey === s.key && (d[markerOpts.key] || 0) > 0;
      const dotColor = flagged ? (markerOpts.color || '#DC2626') : s.color;
      const dotR = flagged ? 3 : 2.5;
      linesSvg += '<circle cx="' + xScale(i).toFixed(1) + '" cy="' + scale(d[s.key] || 0).toFixed(1) + '" r="' + dotR + '" fill="' + dotColor + '"></circle>';
    });
  });

  function pointAriaLabel(d) {
    const parts = [bothAgesTitle(d)];
    barSeries.forEach(s => parts.push(s.name + ' ' + Math.round(d[s.key] || 0).toLocaleString('en-CA') + ' dollars'));
    lineSeries.forEach(s => {
      const v = d[s.key] || 0;
      parts.push(s.name + ' ' + (usesRightAxis(s) && opts.rightAxisFormat === 'percent' ? v.toFixed(1) + ' percent' : Math.round(v).toLocaleString('en-CA') + ' dollars'));
    });
    return parts.join(', ');
  }

  let hoverSvg = '';
  data.forEach((d, i) => {
    hoverSvg += '<rect class="hover-col" data-idx="' + i + '" tabindex="0" role="button" aria-label="' + escapeAttr(pointAriaLabel(d)) + '" x="' + (marginLeft + i * step).toFixed(1) + '" y="' + marginTop + '" width="' + step.toFixed(1) + '" height="' + plotH + '" fill="transparent"></rect>';
  });

  const legend = legendHTML(barSeries.map(s => Object.assign({}, s, { isLine: false })).concat(lineSeries.map(s => Object.assign({}, s, { isLine: true }))));
  const svg = '<svg role="img" aria-label="Interactive retirement projection chart. Use Tab to inspect yearly values." viewBox="0 0 ' + width + ' ' + height + '" width="100%" height="' + height + '" style="display:block">' + gridSvg + barsSvg + linesSvg + xTicksSvg + hoverSvg + '</svg>';
  container.innerHTML = legend + svg;

  const tooltip = getTooltipEl();
  function showPoint(rect, clientX, clientY) {
    const idx = parseInt(rect.getAttribute('data-idx'), 10);
    const d = data[idx];
    tooltip.innerHTML = tooltipHTML(d, barSeries, lineSeries, xLabelPrefix, hasAnyValue);
    tooltip.style.display = 'block';
    if (clientX == null || clientY == null) {
      const box = rect.getBoundingClientRect();
      clientX = box.left + box.width / 2; clientY = box.top + box.height / 2;
    }
    positionTooltip(tooltip, clientX, clientY);
  }

  container.querySelectorAll('.hover-col').forEach(rect => {
    rect.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') showPoint(rect, e.clientX, e.clientY); });
    rect.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') tooltip.style.display = 'none'; });
    rect.addEventListener('click', e => { e.preventDefault(); showPoint(rect, e.clientX, e.clientY); });
    rect.addEventListener('focus', () => showPoint(rect));
    rect.addEventListener('blur', () => { tooltip.style.display = 'none'; });
    rect.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showPoint(rect); }
      if (e.key === 'Escape') { tooltip.style.display = 'none'; rect.blur(); }
    });
  });
}

function bothAgesTitle(d) {
  if (d.selfAge != null && d.spouseAge != null) {
    return 'You: ' + d.selfAge + ' \u00B7 Spouse: ' + d.spouseAge;
  }
  return 'Age ' + d.age;
}

function defaultTooltipHTML(d, barSeries, lineSeries, xLabelPrefix) {
  let h = '<div class="tt-title">' + bothAgesTitle(d) + '</div>';
  barSeries.concat(lineSeries).forEach(s => {
    h += '<div class="tt-row"><span style="color:' + s.color + '">' + s.name + '</span><span class="v">' + moneyTooltip(d[s.key] || 0) + '</span></div>';
  });
  return h;
}

function pctOrDash(numerator, denominator) {
  if (!denominator) return '—';
  return (numerator / denominator * 100).toFixed(1) + '%';
}

function taxTooltipHTML(d, barSeries, lineSeries, xLabelPrefix) {
  let h = '<div class="tt-title">' + bothAgesTitle(d) + '</div>';
  h += '<div class="tt-group">This Year</div>';
  h += '<div class="tt-row"><span style="color:#B5542B">Income Tax</span><span class="v">' + moneyTooltip(d.Tax || 0) + '</span></div>';
  h += '<div class="tt-row tax"><span>Income Tax / Gross Cash Flow</span><span class="v">' + pctOrDash(d.Tax, d["Gross Income"]) + '</span></div>';
  h += '<div class="tt-group">Cumulative</div>';
  h += '<div class="tt-row"><span style="color:#12203A">Income Tax</span><span class="v">' + moneyTooltip(d["Cumulative Tax"] || 0) + '</span></div>';
  h += '<div class="tt-row total"><span>Income Tax / Gross Cash Flow</span><span class="v">' + pctOrDash(d["Cumulative Tax"], d["Cumulative Gross Income"]) + '</span></div>';
  const hasContext = d["Marginal Tax Rate"] != null || d["Effective RRIF Withdrawal Rate"] != null || d.PensionSplitText;
  if (hasContext) h += '<div class="tt-group">Planning Context</div>';
  if (d["Marginal Tax Rate"] != null) h += '<div class="tt-row" style="color:#EF4444"><span>Marginal Income-Tax Rate</span><span class="v">' + d["Marginal Tax Rate"].toFixed(1) + '%</span></div>';
  if (d["Effective RRIF Withdrawal Rate"] != null) h += '<div class="tt-row"><span>Effective cost of extra $1K RRIF withdrawal</span><span class="v">' + d["Effective RRIF Withdrawal Rate"].toFixed(1) + '%</span></div>';
  if (d.PensionSplitText) h += '<div class="tt-row"><span>Pension split for tax</span><span class="v">' + d.PensionSplitText + '</span></div>';
  return h;
}

const INCOME_SOURCE_CATEGORY = {
  'Regular': 'Personal Accounts', 'RRSP/RRIF': 'Personal Accounts', 'TFSA': 'Personal Accounts',
  'OAS': 'Government Benefits', 'CPP': 'Government Benefits', 'GIS': 'Government Benefits', 'TopUp': 'Government Benefits',
  'Pension': 'Other Income', 'Other income': 'Other Income',
};

function incomeTooltipHTML(d, barSeries, lineSeries, xLabelPrefix, hasAnyValue) {
  let h = '<div class="tt-title">' + bothAgesTitle(d) + '</div>';
  let lastCategory = null;
  barSeries.forEach(s => {
    const cat = INCOME_SOURCE_CATEGORY[s.key] || 'Income';
    if (cat !== lastCategory) { h += '<div class="tt-group">' + cat + '</div>'; lastCategory = cat; }
    h += '<div class="tt-row"><span style="color:' + s.color + '">' + s.name + '</span><span class="v">' + moneyTooltip(d[s.key] || 0) + '</span></div>';
  });
  const hasTaxOrBottomLine = (d.OASClawback || 0) > 0 || hasAnyValue('Tax') || hasAnyValue('Net income');
  if (hasTaxOrBottomLine) h += '<div class="tt-group">Tax &amp; Net Income</div>';
  if ((d.OASClawback || 0) > 0) h += '<div class="tt-row" style="color:#DC2626"><span>\u25BC OAS clawback</span><span class="v">(' + moneyTooltip(d.OASClawback) + ')</span></div>';
  if (hasAnyValue('Tax')) h += '<div class="tt-row tax"><span>Income Tax</span><span class="v">(' + moneyTooltip(d.Tax || 0) + ')</span></div>';
  if (hasAnyValue('Net income')) h += '<div class="tt-row total"><span>After-Tax Cash Flow</span><span class="v">' + moneyTooltip(d["Net income"] || 0) + '</span></div>';
  const hasContext = d.PensionSplitText || d["Effective RRIF Withdrawal Rate"] != null;
  if (hasContext) h += '<div class="tt-group">Planning Context</div>';
  if (d.PensionSplitText) h += '<div class="tt-row"><span>Pension split for tax</span><span class="v">' + d.PensionSplitText + '</span></div>';
  if (d["Effective RRIF Withdrawal Rate"] != null) h += '<div class="tt-row"><span>Effective cost of extra $1K RRIF withdrawal</span><span class="v">' + d["Effective RRIF Withdrawal Rate"].toFixed(1) + '%</span></div>';
  return h;
}

function familyTooltipHTML(d, barSeries, lineSeries, xLabelPrefix, hasAnyValue) {
  let h = '<div class="tt-title">' + bothAgesTitle(d) + '</div>';
  if (barSeries.length > 0) h += '<div class="tt-group">By Person</div>';
  barSeries.forEach(s => {
    h += '<div class="tt-row"><span style="color:' + s.color + '">' + s.name + '</span><span class="v">' + moneyTooltip(d[s.key] || 0) + '</span></div>';
  });
  const hasTaxOrBottomLine = hasAnyValue('SelfTax') || hasAnyValue('SpouseTax') || hasAnyValue('Combined net income') || hasAnyValue('Combined Total Assets');
  if (hasTaxOrBottomLine) h += '<div class="tt-group">Tax &amp; Bottom Line</div>';
  if (hasAnyValue('SelfTax')) h += '<div class="tt-row" style="color:' + SELF_COLOR + '"><span>Your Income Tax</span><span class="v">(' + moneyTooltip(d.SelfTax || 0) + ')</span></div>';
  if (hasAnyValue('SpouseTax')) h += '<div class="tt-row" style="color:' + SPOUSE_COLOR + '"><span>Spouse Income Tax</span><span class="v">(' + moneyTooltip(d.SpouseTax || 0) + ')</span></div>';
  if (hasAnyValue('SelfTax') || hasAnyValue('SpouseTax')) h += '<div class="tt-row tax"><span>Combined Income Tax</span><span class="v">(' + moneyTooltip((d.SelfTax || 0) + (d.SpouseTax || 0)) + ')</span></div>';
  if (hasAnyValue('Combined net income')) h += '<div class="tt-row total"><span>Combined After-Tax Cash Flow</span><span class="v">' + moneyTooltip(d["Combined net income"] || 0) + '</span></div>';
  if (hasAnyValue('Combined Total Assets')) h += '<div class="tt-row" style="color:#12203A"><span>Combined Total Assets</span><span class="v">' + moneyTooltip(d["Combined Total Assets"] || 0) + '</span></div>';
  if (d.PensionSplitText) h += '<div class="tt-group">Planning Context</div>';
  if (d.PensionSplitText) h += '<div class="tt-row"><span>Automatic pension split</span><span class="v">' + d.PensionSplitText + '</span></div>';
  return h;
}

    '<li>Investment returns are flat, deterministic annual rates — no sequence-of-returns risk or volatility is modeled.</li>' +
    '<li>The app plans for a couple: you and your spouse each have a fully independent copy of every account and benefit above, toggled via "Planning For." Switching people never resets or overwrites the other person\'s inputs. Each spouse\'s tax is calculated entirely separately, since Canada taxes individuals rather than couples. The "Family income" chart aligns both spouses onto one shared calendar timeline using "Spouse\'s Age When You Retire" to compute the age gap.</li>' +
    '<li><strong>Usability:</strong> charts support mouse hover, touch/click and keyboard focus. Tooltips are kept inside the visible browser window, and the input grid switches to one column on narrow phone screens.</li>' +
    '<li>Educational planning tool, not tax or investment advice.</li>' +

  const assumptionsToggle = document.querySelector('#assumptionsLabel .section-toggle');

}

function pensionSplitTextForRows(primaryRow, spouseRow, primaryLabel, spouseLabel) {
  if ((primaryRow.pensionSplitOut || 0) > 0) return primaryLabel + ' → ' + spouseLabel + ' ' + moneyTooltip(primaryRow.pensionSplitOut);
  if ((spouseRow.pensionSplitOut || 0) > 0) return spouseLabel + ' → ' + primaryLabel + ' ' + moneyTooltip(spouseRow.pensionSplitOut);
  return '';
}

function renderResults() {
  const selfStartAge = state.self.retireAge;
  const spouseStartAge = state.spouse.retireAge;
  const ageGap = state.ageGap;

  // Raw simulations establish account cash flows. Automatic pension splitting
  // is then applied year-by-year as a tax election only; it never moves the
  // underlying pension/RRIF cash between spouses.
  const selfOwnRaw = simulatePerson(state.self, selfStartAge);
  const spouseOwnRaw = simulatePerson(state.spouse, spouseStartAge);
  const spouseForSelfRaw = simulatePerson(state.spouse, selfStartAge + ageGap);
  const selfForSpouseRaw = simulatePerson(state.self, spouseStartAge - ageGap);

  const selfOwnOpt = optimizePensionSplittingRows(selfOwnRaw.rows, spouseForSelfRaw.rows);
  const spouseOwnOpt = optimizePensionSplittingRows(spouseOwnRaw.rows, selfForSpouseRaw.rows);

  const ownRows = state.selectedPerson === "self" ? selfOwnOpt.primaryRows : spouseOwnOpt.primaryRows;
  const otherOwnRows = state.selectedPerson === "self" ? selfOwnOpt.secondaryRows : spouseOwnOpt.secondaryRows;
  const ownGG = state.selectedPerson === "self" ? selfOwnOpt.primaryBenefits : spouseOwnOpt.primaryBenefits;
  const ownRawRows = state.selectedPerson === "self" ? selfOwnRaw.rows : spouseOwnRaw.rows;
  const otherOwnRawRows = state.selectedPerson === "self" ? spouseForSelfRaw.rows : selfForSpouseRaw.rows;

  const familyStartAgeSelf = Math.min(selfStartAge, spouseStartAge - ageGap);
  const selfFamilyRaw = simulatePerson(state.self, familyStartAgeSelf);
  const spouseFamilyRaw = simulatePerson(state.spouse, familyStartAgeSelf + ageGap);
  const familyOpt = optimizePensionSplittingRows(selfFamilyRaw.rows, spouseFamilyRaw.rows);
  const selfFamilyRows = familyOpt.primaryRows;
  const spouseFamilyRows = familyOpt.secondaryRows;
  const selfFamilyGG = familyOpt.primaryBenefits;
  const spouseFamilyGG = familyOpt.secondaryBenefits;

  const combinedIncomeChartData = selfFamilyRows.map((selfRow, i) => {
    const spouseRow = spouseFamilyRows[i];
    const selfGG = selfFamilyGG[i], spouseGG = spouseFamilyGG[i];
    const selfProvTax = Math.max(0, selfRow.provTax - selfGG.taxReduction);
    const selfTotalTax = selfRow.fedTax + selfProvTax;
    const spouseProvTax = Math.max(0, spouseRow.provTax - spouseGG.taxReduction);
    const spouseTotalTax = spouseRow.fedTax + spouseProvTax;

    const selfAssets = selfRow.regClose + selfRow.rrspClose + selfRow.tfsaClose;
    const spouseAssets = spouseRow.regClose + spouseRow.rrspClose + spouseRow.tfsaClose;
    const selfGross = selfRow.totalIncome + selfGG.gis + selfGG.topUp;
    const spouseGross = spouseRow.totalIncome + spouseGG.gis + spouseGG.topUp;
    return {
      age: selfRow.age, selfAge: selfRow.age, spouseAge: spouseRow.age,
      You: Math.round(selfGross), Spouse: Math.round(spouseGross),
      SelfTax: Math.round(selfTotalTax), SpouseTax: Math.round(spouseTotalTax),
      Tax: Math.round(selfTotalTax + spouseTotalTax),
      "Gross Income": Math.round(selfGross + spouseGross),
      "Tax Rate": (selfGross + spouseGross) > 0 ? (selfTotalTax + spouseTotalTax) / (selfGross + spouseGross) * 100 : 0,
      "Combined net income": Math.round(selfRow.totalIncome - selfTotalTax + selfGG.gis + selfGG.topUp + spouseRow.totalIncome - spouseTotalTax + spouseGG.gis + spouseGG.topUp),
      "Combined Total Assets": Math.round(selfAssets + spouseAssets),
      PensionSplitText: pensionSplitTextForRows(selfRow, spouseRow, 'You', 'Spouse'),
    };
  });
  let cumCombinedTax = 0, cumCombinedGross = 0;
  combinedIncomeChartData.forEach(d => {
    cumCombinedTax += d.SelfTax + d.SpouseTax;
    cumCombinedGross += d["Gross Income"];
    d["Cumulative Tax"] = Math.round(cumCombinedTax);
    d["Cumulative Gross Income"] = Math.round(cumCombinedGross);
    d["Cumulative Tax Rate"] = cumCombinedGross > 0 ? (cumCombinedTax / cumCombinedGross * 100) : 0;
  });

  const combinedBalanceChartData = selfFamilyRows.map((selfRow, i) => {
    const spouseRow = spouseFamilyRows[i];
    const selfAssets = selfRow.regClose + selfRow.rrspClose + selfRow.tfsaClose;
    const spouseAssets = spouseRow.regClose + spouseRow.rrspClose + spouseRow.tfsaClose;
    return {
      age: selfRow.age, selfAge: selfRow.age, spouseAge: spouseRow.age,
      You: Math.round(selfAssets), Spouse: Math.round(spouseAssets),
      "Combined Total Assets": Math.round(selfAssets + spouseAssets),
    };
  });

  const chartData = ownRows.map((r, i) => ({
    age: r.age,
    selfAge: state.selectedPerson === "self" ? r.age : otherOwnRows[i].age,
    spouseAge: state.selectedPerson === "spouse" ? r.age : otherOwnRows[i].age,
    Regular: Math.round(r.regClose), "RRSP/RRIF": Math.round(r.rrspClose),
    TFSA: Math.round(r.tfsaClose),
  }));

  const pensionLabel = pensionPlanName(), topUpLabel = topUpName();
  const MARGINAL_DELTA = 1000;
  const incomeChartData = ownRows.map((r, i) => {
    const finalProvTax = Math.max(0, r.provTax - ownGG[i].taxReduction);
    const finalTotalTax = r.fedTax + finalProvTax;
    const grossIncome = r.totalIncome + ownGG[i].gis + ownGG[i].topUp;
    const finalNetIncome = grossIncome - finalTotalTax;
    const taxAtCurrent = calcTax(r.taxableIncome, state.province, r.age, r.inflationFactor, r.eligiblePensionIncome).totalTax;
    const taxAtMore = calcTax(r.taxableIncome + MARGINAL_DELTA, state.province, r.age, r.inflationFactor, r.eligiblePensionIncome).totalTax;
    const marginalRate = (taxAtMore - taxAtCurrent) / MARGINAL_DELTA * 100;
    const effectiveWithdrawalRate = (ownRawRows[i].rrspOpen > 0 || ownRawRows[i].rrspWD > 0)
      ? effectiveMarginalRrifWithdrawalRate(ownRawRows[i], otherOwnRawRows[i]) : null;
    const primaryLabel = state.selectedPerson === 'self' ? 'You' : 'Spouse';
    const spouseLabel = state.selectedPerson === 'self' ? 'Spouse' : 'You';

    return {
      age: r.age,
      selfAge: state.selectedPerson === "self" ? r.age : otherOwnRows[i].age,
      spouseAge: state.selectedPerson === "spouse" ? r.age : otherOwnRows[i].age,
      Regular: Math.round(r.regWD), "RRSP/RRIF": Math.round(r.rrspWD), TFSA: Math.round(r.tfsaWD),
      OAS: Math.round(r.oasNet), CPP: Math.round(r.cpp), GIS: Math.round(ownGG[i].gis), TopUp: Math.round(ownGG[i].topUp),
      Pension: Math.round(r.pension), "Other income": Math.round(r.otherIncome),
      Tax: Math.round(finalTotalTax), "Net income": Math.round(finalNetIncome), OASClawback: Math.round(r.oasClawback),
      "Gross Income": Math.round(grossIncome),
      "Tax Rate": grossIncome > 0 ? (finalTotalTax / grossIncome * 100) : 0,
      "Marginal Tax Rate": marginalRate,
      "Effective RRIF Withdrawal Rate": effectiveWithdrawalRate,
      PensionSplitText: pensionSplitTextForRows(r, otherOwnRows[i], primaryLabel, spouseLabel),
    };
  });
  let cumTax = 0, cumGross = 0;
  incomeChartData.forEach(d => {
    cumTax += d.Tax;
    cumGross += d["Gross Income"];
    d["Cumulative Tax"] = Math.round(cumTax);
    d["Cumulative Gross Income"] = Math.round(cumGross);
    d["Cumulative Tax Rate"] = cumGross > 0 ? (cumTax / cumGross * 100) : 0;
  });

  const lbl = personLabel();
  document.getElementById('incomeChartLabel').innerHTML = collapsibleSectionLabel('income', 'scale', '#1F6F5C', 'Cash flow by source, with after-tax trend — ' + lbl);
  document.getElementById('combinedIncomeChartLabel').innerHTML = collapsibleSectionLabel('combinedIncome', 'users', '#12203A', 'Combined cash flow, you + spouse');
  document.getElementById('taxChartLabel').innerHTML = collapsibleSectionLabel('tax', 'scale', '#B5542B', 'Income tax by year, with tax rates — ' + lbl);
  document.getElementById('combinedTaxChartLabel').innerHTML = collapsibleSectionLabel('combinedTax', 'scale', '#B5542B', 'Combined income tax by year, with tax rates');
  document.getElementById('balanceChartLabel').innerHTML = collapsibleSectionLabel('balance', 'trending', '#1F6F5C', 'Account balances by age — ' + lbl);
  document.getElementById('combinedBalanceChartLabel').innerHTML = collapsibleSectionLabel('combinedBalance', 'trending', '#12203A', 'Combined account balance, you + spouse');

  document.getElementById('incomeChart').style.display = state.collapsed.income ? 'none' : '';
  document.getElementById('combinedIncomeChart').style.display = state.collapsed.combinedIncome ? 'none' : '';
  document.getElementById('taxChart').style.display = state.collapsed.tax ? 'none' : '';
  document.getElementById('combinedTaxChart').style.display = state.collapsed.combinedTax ? 'none' : '';
  document.getElementById('balanceChart').style.display = state.collapsed.balance ? 'none' : '';
  document.getElementById('combinedBalanceChart').style.display = state.collapsed.combinedBalance ? 'none' : '';

  const hasTopUp = state.province !== "PE" && state.province !== "SK" && state.province !== "NS" && state.province !== "NB" && state.province !== "YT";
  const allIncomeSeries = [
     { key: 'Regular', color: '#1F6F5C', name: 'Regular' }, { key: 'RRSP/RRIF', color: '#2C4A7C', name: 'RRIF' }, { key: 'TFSA', color: TFSA_COLOR, name: 'TFSA' },
     { key: 'OAS', color: '#6B4C93', name: 'OAS' }, { key: 'CPP', color: '#B08A2E', name: pensionLabel }, { key: 'GIS', color: '#9B6B43', name: 'GIS' }
  ];
  if (hasTopUp) allIncomeSeries.push({ key: 'TopUp', color: '#2E7D5B', name: topUpLabel });
  allIncomeSeries.push(
     { key: 'Pension', color: '#4A6FA5', name: 'Pension' }, { key: 'Other income', color: '#6B7A8F', name: 'Other income' }
  );

  buildChart('incomeChart', incomeChartData, allIncomeSeries,
    [{ key: 'Net income', color: '#12203A', name: 'After-Tax Cash Flow' }],
    incomeTooltipHTML, 'Age ', { key: 'OASClawback', lineKey: 'Net income', color: '#DC2626' });

  buildChart('combinedIncomeChart', combinedIncomeChartData,
    [{ key: 'You', color: SELF_COLOR, name: 'You' }, { key: 'Spouse', color: SPOUSE_COLOR, name: 'Spouse' }],
    [{ key: 'Combined net income', color: '#12203A', name: 'Combined After-Tax Cash Flow' }],
    familyTooltipHTML, "Your age ");

  buildChart('taxChart', incomeChartData,
    [{ key: 'Tax', color: '#B5542B', name: 'Income Tax' }],
    [{ key: 'Tax Rate', color: '#8B1A1A', name: 'Income Tax / Gross Cash Flow' }, { key: 'Cumulative Tax Rate', color: '#12203A', name: 'Cumulative Income Tax / Cumulative Gross Cash Flow' },
     { key: 'Marginal Tax Rate', color: '#EF4444', name: 'Marginal Income-Tax Rate' }],
    taxTooltipHTML, 'Age ', null, { dualAxis: true, rightAxisFormat: 'percent' });

  buildChart('combinedTaxChart', combinedIncomeChartData,
    [{ key: 'SelfTax', color: SELF_COLOR, name: 'Your Income Tax' }, { key: 'SpouseTax', color: SPOUSE_COLOR, name: 'Spouse Income Tax' }],
    [{ key: 'Tax Rate', color: '#8B1A1A', name: 'Income Tax / Gross Cash Flow' }, { key: 'Cumulative Tax Rate', color: '#12203A', name: 'Cumulative Income Tax / Cumulative Gross Cash Flow' }],
    taxTooltipHTML, "Your age ", null, { dualAxis: true, rightAxisFormat: 'percent' });

  buildChart('balanceChart', chartData,
    [{ key: 'Regular', color: '#1F6F5C', name: 'Regular' }, { key: 'RRSP/RRIF', color: '#2C4A7C', name: 'RRIF' }, { key: 'TFSA', color: TFSA_COLOR, name: 'TFSA' }],
    [], defaultTooltipHTML, 'Age ');

  buildChart('combinedBalanceChart', combinedBalanceChartData,
    [{ key: 'You', color: SELF_COLOR, name: 'You' }, { key: 'Spouse', color: SPOUSE_COLOR, name: 'Spouse' }],
    [], familyTooltipHTML, "Your age ");

  ['incomeChartLabel', 'combinedIncomeChartLabel', 'taxChartLabel', 'combinedTaxChartLabel', 'balanceChartLabel', 'combinedBalanceChartLabel'].forEach(labelId => {
    const btn = document.querySelector('#' + labelId + ' .section-toggle');
    if (btn) btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-toggle-key');
      state.collapsed[key] = !state.collapsed[key];
      renderResults();
    });
  });
}

// =============================================================================
// Init
// =============================================================================
document.getElementById('provinceSelect').addEventListener('change', e => {
  state.province = e.target.value;
  
  const maxPensionAge = pensionStartMax(state.province);
  state.self.cppStartAge = Math.min(state.self.cppStartAge, maxPensionAge);
  state.spouse.cppStartAge = Math.min(state.spouse.cppStartAge, maxPensionAge);
  
  renderIntro();
  renderControls();
  renderResults();
  renderAssumptions();
});
renderIntro();
renderControls();
renderResults();
renderAssumptions();
window.addEventListener('resize', renderResults);
</script>
</body>
</html>
